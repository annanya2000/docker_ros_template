services:
  ros2_ws:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    container_name: ros2_${ROS_DISTRO:-jazzy}_ws
    image: ros2_${ROS_DISTRO:-jazzy}_ws:latest
    entrypoint: ["/ros_entrypoint.sh"]
    command: ["bash","-lc","sleep infinity"]
    tty: true
    stdin_open: true
    network_mode: host
    volumes:
      - ./src:/ros2_ws/src
      - ./build:/ros2_ws/build
      - ./install:/ros2_ws/install
      - ./log:/ros2_ws/log
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    devices:
      - /dev/dri:/dev/dri

